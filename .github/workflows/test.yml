name: Test Plugin

on:
  pull_request:
    branches:
      - master

jobs:

  lint:
    name: PHP Code Sniffer
    uses: tarosky/workflows/.github/workflows/phpcs.yml@main
    with:
      version: '7.4'

  short-open-tag:
    name: Short Open Tag Check
    uses: tarosky/workflows/.github/workflows/php-short-open-tag.yml@main

  assets:
    name: Assets Test
    uses: tarosky/workflows/.github/workflows/npm.yml@main
    with:
      command: lint
      package: package

  phpunit:
    name: PHPUnit
    strategy:
      matrix:
        php: [ '7.4', '8.3' ]
        wp: [ '5.9', 'latest' ]
    uses: tarosky/workflows/.github/workflows/wp-unit-test.yml@main
    with:
      php_version: ${{ matrix.php }}
      wp_version: ${{ matrix.wp }}

  status-check:
    name: Status Check
    runs-on: ubuntu-latest
    needs: [ lint, short-open-tag, assets, phpunit ]
    if: always()
    steps:
      - uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
